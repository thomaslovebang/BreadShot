[package]
name = "focusflow-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
focusflow-domain = { path = "../../../crates/domain" }
focusflow-recorder = { path = "../../../crates/recorder" }
focusflow-tracker = { path = "../../../crates/tracker" }
focusflow-focus-engine = { path = "../../../crates/focus_engine" }
focusflow-renderer = { path = "../../../crates/renderer" }
focusflow-project-store = { path = "../../../crates/project_store" }
focusflow-editor-core = { path = "../../../crates/editor_core" }
focusflow-platform-windows = { path = "../../../crates/platform_windows" }
