name: 功能建议
description: 告诉我们怎样让 FocusFlow 更好用
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到了什么问题？
      description: 请先描述使用场景，而不只是功能名称。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你希望 FocusFlow 怎样解决？
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: 这个问题出现频率
      options:
        - 每次录制都会遇到
        - 经常遇到
        - 偶尔遇到
        - 只是一个未来想法
    validations:
      required: true
