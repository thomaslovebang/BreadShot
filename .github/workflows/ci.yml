name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Prepare verified FFmpeg resources
        working-directory: apps/desktop
        run: npm run prepare:ffmpeg

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Report real Automatic Director evidence
        shell: pwsh
        run: |
          cargo run --quiet -p focusflow-focus-engine --bin real_benchmark > real-benchmark.md
          $exitCode = $LASTEXITCODE
          Get-Content real-benchmark.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $exitCode
